# Demande directement l'A1 a Oracle (API compute, sans la stack) toutes les ~5 min, comme chasse-pc\chasse.ps1,
# puis previent sur ntfy et se desactive. Toute erreur autre que capacite/429/reseau : notif + pause.
# Garde-fou : une A1 existe deja (creee par le PC ou un passage precedent) -> stop, pas de 2e instance.
# Secrets : OCI_CONFIG (config sans key_file), OCI_KEY (.pem du bot), SUBNET_ID, SSH_PUB, NTFY_URL.
# Relancer apres une pause : onglet Actions -> a1-hunt -> Enable workflow, puis Run workflow.
name: a1-hunt
on:
  # depot public = minutes illimitees ; repasse en prive => remettre */30 (quota 2000 min/mois)
  # le cron n'a JAMAIS declenche (23-24/11, 0 run "schedule") : moteur = l'etape "relance" (chaque run lance le suivant)
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
permissions: {actions: write}

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
    steps:
      # version de l'image du runner : si elle change (nouveau Python), le cache de l'outil est refait
      - id: img
        run: echo "v=$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/pipx
            ~/.local/bin
          key: oci-cli-${{ runner.os }}-${{ steps.img.outputs.v }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pipx install oci-cli
      - name: config
        env: {CFG: '${{ secrets.OCI_CONFIG }}', KEY: '${{ secrets.OCI_KEY }}', SSH: '${{ secrets.SSH_PUB }}'}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$CFG" > ~/.oci/config
          printf '%s\n' "$KEY" > ~/.oci/key.pem
          printf '%s\n' "$SSH" > ~/.oci/a1-ssh.pub
          echo "key_file=$HOME/.oci/key.pem" >> ~/.oci/config
          chmod 600 ~/.oci/config ~/.oci/key.pem
      - name: essai
        env:
          SUBNET: ${{ secrets.SUBNET_ID }}
          NTFY: ${{ secrets.NTFY_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notify() { curl -s -H "Title: $1" -d "$2" "$NTFY" >/dev/null; }
          stop()   { gh workflow disable a1-hunt -R "$GITHUB_REPOSITORY"; }
          fail()   { echo "ERREUR : $1"; notify "A1 : probleme, chasse GitHub en pause" "$1"; stop; exit 1; }
          fini()   { notify "A1 CREEE" "La machine A1 existe. Previens Claude."; stop; exit 0; }

          # notif seulement au lancement a la main, pas a chaque maillon de la chaine (lance par github-actions[bot])
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_TRIGGERING_ACTOR" != 'github-actions[bot]' ] && notify "A1 : chasse GitHub lancee" "Essai toutes les ~5 min."

          comp=$(sed -n 's/^tenancy=//p' ~/.oci/config)
          n=$(oci compute instance list --compartment-id "$comp" --all --raw-output --query \
            "length(data[?shape=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" 2>&1) \
            || { case "$n" in *TooManyRequests*|*'"status": 5'*) echo "lecture impossible, passage saute"; exit 0 ;; esac
                 fail "instance list : $n"; }
          # aucune instance du tout -> oci n'affiche rien (pas meme 0)
          [ "${n:-0}" = 0 ] || { echo "A1 deja la ($n)"; fini; }

          # memes reglages que chasse-pc (shape.json, options.json)
          out=$(oci compute instance launch --compartment-id "$comp" \
            --availability-domain 'rmSV:EU-MADRID-1-AD-1' \
            --shape VM.Standard.A1.Flex --shape-config '{"ocpus": 1, "memoryInGBs": 6}' \
            --image-id ocid1.image.oc1.eu-madrid-1.aaaaaaaahv6cr6fc6d7vjymz5igvzb57myjdtl4m5e2z22fhnzuoyzgi7xoq \
            --subnet-id "$SUBNET" --assign-public-ip true --boot-volume-size-in-gbs 200 \
            --ssh-authorized-keys-file ~/.oci/a1-ssh.pub --is-pv-encryption-in-transit-enabled true \
            --instance-options '{"areLegacyImdsEndpointsDisabled": true}' --display-name a1 2>&1) && fini
          case "$out" in
            *'ut of host capacity'*) echo "pas de place" ;;
            # 429 = limite par utilisateur (partagee avec la chasse PC, meme bot) : on retente au passage suivant
            *TooManyRequests*) echo "Oracle freine (429)" ;;
            *'"status": 5'*|*Connection*|*'timed out'*|*'Max retries'*) echo "erreur reseau ou Oracle passagere" ;;
            *) fail "launch : $out" ;;
          esac
      # Chaine : chaque run lance le suivant (GITHUB_TOKEN a le droit de declencher workflow_dispatch).
      # Seuls les runs "dispatch" relancent -> si le cron se reveille, il ne cree pas de chaines en plus.
      # Arret : workflow desactive (succes/erreur, la relance echoue alors) ou run annule a la main.
      - name: relance
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          NTFY: ${{ secrets.NTFY_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep $((150 + RANDOM % 90))
          gh workflow run a1-hunt -R "$GITHUB_REPOSITORY" && exit 0
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/a1-hunt.yml" --jq .state || echo inconnu)
          [ "$state" = active ] || { echo "workflow $state : chaine arretee"; exit 0; }
          curl -s -H "Title: A1 : chasse GitHub arretee" -d "Relance impossible : Actions -> a1-hunt -> Run workflow." "$NTFY" >/dev/null
          exit 1
